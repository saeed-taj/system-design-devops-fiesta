<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusNotes Frontend</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(to bottom, #0f0f0f, #1c1c1c); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; padding: 30px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; }
        h1 { font-size: 2rem; font-weight: 600; color: #ff9800; margin-bottom: 20px; }
        .messages { margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; max-height: 200px; overflow-y: auto; text-align: left; }
        .messages p { padding: 10px; background: rgba(255, 255, 255, 0.2); border-radius: 8px; margin-bottom: 5px; font-size: 0.95rem; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.05); color: #fff; border-radius: 8px; font-size: 16px; margin-bottom: 10px; text-align: center; }
        input[type="submit"] { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff9800, #e65100); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1> CampusNotes </h1>
        <div class="messages" id="notesList">
            <!-- Notes will load here dynamically -->
        </div>
        <form id="noteForm">
            <input type="text" id="noteInput" placeholder="Type your campus note..." required>
            <input type="submit" value="Add Note">
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const API_URL = "http://localhost:3000/api/notes"; // Adjust based on your API route

        function fetchNotes() {
            $.get(API_URL, function(data) {
                let notesHtml = "";
                data.forEach(note => {
                    notesHtml += `<p>${note.text}</p>`;
                });
                $("#notesList").html(notesHtml);
            });
        }

        $(document).ready(function() {
            fetchNotes();

            $("#noteForm").on("submit", function(event) {
                event.preventDefault();
                let text = $("#noteInput").val().trim();
                if (!text) return;

                $.ajax({
                    url: API_URL,
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ text: text }),
                    success: function(response) {
                        $("#noteInput").val("");
                        fetchNotes();
                    },
                    error: function(err) {
                        console.error("Error adding note", err);
                    }
                });
            });
        });
    </script>
</body>
</html>
